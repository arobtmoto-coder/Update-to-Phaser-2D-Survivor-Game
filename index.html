<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Coin Rush - Action Survivor</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Phaser 3 Engine -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d0f18;
            color: #fff;
            overflow: hidden;
            font-family: sans-serif;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

<div id="game-container"></div>

<script>
    // Telegram WebApp Initialization
    const tg = window.Telegram?.WebApp;
    if (tg) {
        tg.ready();
        tg.expand();
    }

    // Phaser Game Configuration
    const config = {
        type: Phaser.AUTO,
        width: window.innerWidth,
        height: window.innerHeight,
        parent: 'game-container',
        physics: {
            default: 'arcade',
            arcade: {
                gravity: { y: 0 },
                debug: false
            }
        },
        scene: {
            preload: preload,
            create: create,
            update: update
        }
    };

    const game = new Phaser.Game(config);

    let player;
    let enemies;
    let bullets;
    let score = 0;
    let scoreText;
    let lastFired = 0;
    let cursors;

    function preload() {
        // Placeholders generated programmatically using Graphics
    }

    function create() {
        // Player (Green Circle)
        const playerGraphics = this.add.graphics();
        playerGraphics.fillStyle(0x00ff88, 1);
        playerGraphics.fillCircle(16, 16, 16);
        playerGraphics.generateTexture('playerTexture', 32, 32);
        playerGraphics.destroy();

        // Enemy (Red Circle)
        const enemyGraphics = this.add.graphics();
        enemyGraphics.fillStyle(0xff4444, 1);
        enemyGraphics.fillCircle(12, 12, 12);
        enemyGraphics.generateTexture('enemyTexture', 24, 24);
        enemyGraphics.destroy();

        // Bullet (Yellow Circle)
        const bulletGraphics = this.add.graphics();
        bulletGraphics.fillStyle(0xffff00, 1);
        bulletGraphics.fillCircle(4, 4, 4);
        bulletGraphics.generateTexture('bulletTexture', 8, 8);
        bulletGraphics.destroy();

        // Player Setup
        player = this.physics.add.sprite(config.width / 2, config.height / 2, 'playerTexture');
        player.setCollideWorldBounds(true);

        // Groups
        enemies = this.physics.add.group();
        bullets = this.physics.add.group({
            defaultKey: 'bulletTexture',
            maxSize: 30
        });

        // Controls (Touch/Drag & Keyboard)
        cursors = this.input.keyboard.createCursorKeys();
        
        this.input.on('pointermove', function (pointer) {
            if (pointer.isDown) {
                this.physics.moveToObject(player, pointer, 200);
            }
        }, this);

        this.input.on('pointerup', function () {
            player.setVelocity(0, 0);
        });

        // Enemy Spawner Timer (Every 1.5 seconds)
        this.time.addEvent({
            delay: 1500,
            callback: spawnEnemy,
            callbackScope: this,
            loop: true
        });

        // Collisions
        this.physics.add.overlap(bullets, enemies, destroyEnemy, null, this);
        this.physics.add.overlap(player, enemies, hitPlayer, null, this);

        // Score UI
        scoreText = this.add.text(16, 16, 'Coins: 0', { fontSize: '20px', fill: '#fff' });
    }

    function update(time, delta) {
        // Keyboard Controls Fallback
        if (!this.input.activePointer.isDown) {
            player.setVelocity(0);
            if (cursors.left.isDown) player.setVelocityX(-200);
            if (cursors.right.isDown) player.setVelocityX(200);
            if (cursors.up.isDown) player.setVelocityY(-200);
            if (cursors.down.isDown) player.setVelocityY(200);
        }

        // Enemies chase player
        enemies.getChildren().forEach(enemy => {
            this.physics.moveToObject(enemy, player, 80);
        });

        // Auto Shooting Logic (Find nearest enemy)
        if (time > lastFired) {
            let nearestEnemy = getNearestEnemy();
            if (nearestEnemy) {
                fireBullet.call(this, nearestEnemy);
                lastFired = time + 300; // Attack speed
            }
        }
    }

    function spawnEnemy() {
        let x, y;
        if (Math.random() < 0.5) {
            x = Math.random() < 0.5 ? 0 : config.width;
            y = Math.random() * config.height;
        } else {
            x = Math.random() * config.width;
            y = Math.random() < 0.5 ? 0 : config.height;
        }

        let enemy = enemies.create(x, y, 'enemyTexture');
        enemy.setBounce(1);
        enemy.setCollideWorldBounds(true);
    }

    function getNearestEnemy() {
        let nearest = null;
        let minDistance = 300; // Shooting Range

        enemies.getChildren().forEach(enemy => {
            let distance = Phaser.Math.Distance.Between(player.x, player.y, enemy.x, enemy.y);
            if (distance < minDistance) {
                minDistance = distance;
                nearest = enemy;
            }
        });
        return nearest;
    }

    function fireBullet(target) {
        let bullet = bullets.get(player.x, player.y);
        if (bullet) {
            bullet.setActive(true);
            bullet.setVisible(true);
            this.physics.moveToObject(bullet, target, 400);
        }
    }

    function destroyEnemy(bullet, enemy) {
        bullet.destroy();
        enemy.destroy();
        score += 10;
        scoreText.setText('Coins: ' + score);
    }

    function hitPlayer(player, enemy) {
        this.physics.pause();
        player.setTint(0xff0000);
        scoreText.setText('GAME OVER! Coins: ' + score);
    }
</script>

</body>
</html>
